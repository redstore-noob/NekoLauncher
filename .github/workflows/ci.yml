name: NekoLauncher CI

on:
  push:
    branches: [main, master]
    # 版本标签两种风格都接受：v1.2.3 与 0.2.0（纯数字开头）
    tags: ['v*', '0.*', '[1-9].*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: NekoLauncher
  GO_VERSION: '1.27'
  NODE_VERSION: '22'

jobs:
  checks:
    name: Vet & Test
    # 固定 22.04：wails v2.15 的 linux 端是 cgo，pkg-config 认的是 webkit2gtk-4.0，
    # 该 API 包在 24.04+ 已被移除；vet/test 编译 main 包同样需要这些头文件
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Linux dependencies (webkit2gtk)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev \
            libnss3-dev libasound2 pkg-config imagemagick

      # main.go 以 go:embed all:frontend/dist 嵌入前端产物：没有该目录时
      # vet/test/跨平台编译会在 embed 阶段直接失败。本 job 只验证 Go 代码，
      # 垫一个占位文件让 embed 通过即可（真正的产物由 build job 构建）。
      - name: Prepare embedded assets placeholder
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep

      - name: go vet
        run: go vet ./...

      - name: Cross-compile check
        # 只跑 vet/test 发现不了跨平台编译错误：平台专属符号（syscall.NewLazyDLL、
        # x/sys/windows/registry、SysProcAttr.HideWindow 等）写在共用文件里时，
        # 在本平台能编过、到别的平台直接失败。这里显式三平台编译兜住。
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=darwin  GOARCH=arm64 go build ./...
          GOOS=linux   GOARCH=amd64 go build ./...

      - name: go test
        run: go test ./...

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check, lint & unit tests
        # vitest 起步阶段只覆盖纯函数（lib/*、页面内容完整性），但 tsc 会一并检查测试文件，
        # 所以这一步同时兜住"测试文件与源码类型不同步"。
        # eslint 用 --max-warnings 0：prettier 的换行建议也算失败，避免格式债累积。
        working-directory: frontend
        run: |
          npx tsc --noEmit
          npx eslint src --max-warnings 0
          npm test

  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # 内置 CurseForge API Key（builtin_keys.go 编译期注入）。Secret 缺省为空串
    # 时 ldflags 注入空值，行为等同未注入：CurseForge 走"未配置 Key"引导。
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ⚠️ 矩阵字段只有写进 job 定义才会生效。
          #    这里曾经在矩阵里写 `container: fedora:42`，但 job 上根本没有
          #    `container:` 键，于是 fedora/arch 两个 job 实际跑在 ubuntu 上，
          #    pacman / dnf 直接 command not found（exit 127，0 秒即挂）。
          #    现在发行包统一交给 nfpm（纯 Go）产出，不需要目标发行版的原生工具链，
          #    容器整个去掉了。详见 docs/RELEASE_PACKAGING.md。
          - name: windows/amd64
            # artifact 名不能含斜杠：upload-artifact@v4 会直接拒绝
            # （The artifact name is not valid ... Forward slash）。
            # name 给人看（带斜杠更清楚），artifact 另用一个无斜杠的字段。
            artifact: NekoLauncher-windows-amd64
            os: windows-latest
            platform: windows/amd64
          # ---- Linux：一个发行版一个 job，因为 webkit2gtk 的 API 版本绑死在编译器上 ----
          # wails v2.15 的 linux 端是 cgo，pkg-config 要么认 webkit2gtk-4.0、要么认 4.1，
          # 两套 API 包不能共存，所以"哪个环境编出来的"直接决定了能装哪些发行版：
          #   ubuntu-22.04（4.0）→ glibc 基线 2.35：Debian 12 / Ubuntu 22.04 及更老的 apt 系
          #   ubuntu-24.04（4.1）→ glibc 基线 2.39：Debian 13 / Ubuntu 24.04 及更新的 apt 系
          # 打包走 nfpm，不依赖 dpkg-deb；两个 deb 的资产名带 glibc 基线，避免同名互相覆盖。
          #
          # ⚠️ ubuntu-22.04 已过支持期：GitHub 于 2026-09-17 结束它的 active support，
          #    2027-04-17 彻底移除（runner 仍能跑，只是不再更新且随时可能进 brownout）。
          #    到那天只能二选一：
          #      a) 放弃 webkit2gtk 4.0 的老 apt 系（Debian 12 / Ubuntu 22.04 用户）；
          #      b) 用一个 debian:12 容器代替 ubuntu-22.04 来产这份 glibc 2.35 的包。
          #    倾向 (b)：Debian 12 的生命周期比 Ubuntu 22.04 长，且同样提供 4.0。
          # ⚠️ 24.04 上必须带 -tags webkit2_41（见下面的构建步骤）：
          #    wails 的 cgo 指令是 `#cgo !webkit2_41 pkg-config: webkit2gtk-4.0`，
          #    不加标签时它会去找 4.0，而 4.0 的 API 包在 24.04 已经没有了，
          #    编译直接失败（22.04 那个 job 反而是对的，所以两边表现不一样）。
          - name: linux/amd64 (apt · glibc 2.35)
            artifact: NekoLauncher-linux-amd64-apt-glibc-2.35
            os: ubuntu-22.04
            platform: linux/amd64
            linux-artifacts: deb-glibc-2.35
          - name: linux/amd64 (apt · glibc 2.39)
            artifact: NekoLauncher-linux-amd64-apt-glibc-2.39
            os: ubuntu-24.04
            platform: linux/amd64
            linux-artifacts: deb-glibc-2.39
          # rpm 与 pacman 包也在 ubuntu-24.04 上产出，不再用 fedora / arch 容器：
          #  1. nfpm 是纯 Go，deb/rpm/pkg.tar.zst 三种格式它自己就能写，
          #     不需要 rpm-build / makepkg 那套原生工具链（本地在 Windows 上实测能产全三种）；
          #  2. 二进制这边也安全：Fedora 42 / Arch 的 glibc 都比 2.39 新，
          #     24.04 上编的（链 webkit2gtk-4.1）在它们上面直接能跑。
          # 顺带省掉拉镜像的时间，7 个 job 的矩阵也更好维护。
          - name: linux/amd64 (rpm)
            artifact: NekoLauncher-linux-amd64-rpm
            os: ubuntu-24.04
            platform: linux/amd64
            linux-artifacts: rpm
          - name: linux/amd64 (pacman)
            artifact: NekoLauncher-linux-amd64-pacman
            os: ubuntu-24.04
            platform: linux/amd64
            linux-artifacts: pkg.tar.zst
          # ---- macOS：Intel 与 Apple Silicon 分开出包 ----
          # 之前的 darwin/universal 是把两个架构的二进制 lipo 进同一个 .app，包大一倍；
          # 现在各出各的。
          # macos-15-intel 是 GitHub 给 x86_64 的标签（macos-13 已于 2025-12-04 退役，
          # macos-latest / macos-15 / macos-26 都是 arm64）。Apple 已弃用 Intel，
          # GitHub 说 macOS 15 镜像退役后（2027 秋）不再有 Intel runner —— 到时候
          # 这个 job 要么去掉、要么改用交叉编译。
          - name: darwin/amd64
            artifact: NekoLauncher-darwin-amd64
            os: macos-15-intel
            platform: darwin/amd64
          # 用 macos-15 而不是 macos-14：14 的支持已于 2026-07-06 进入弃用期，
          # 2026-11-02 就会被摘掉（macos-latest 现在指 15+，14 属于最老那档）。
          - name: darwin/arm64
            artifact: NekoLauncher-darwin-arm64
            os: macos-15
            platform: darwin/arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 先把前端依赖装好：wails build 自己会跑 wails.json 里的 frontend:install
      # （`npm install`）与 frontend:build，而 `npm install` 在 CI 上既慢又会按
      # package.json 重新解析版本 —— macOS runner 上实测要 3 分钟，还会把构建步骤
      # 拖到被 runner 掐断。这里用 `npm ci` 按 lock 装一次，之后 wails 检测到
      # node_modules 已是最新就会跳过安装。
      # 注意别用 `-s` / `-skipbindings` 省这一步：main.go 要 embed frontend/dist，
      # 没有前端产物时 embed 会直接失败。
      - name: Install frontend dependencies
        shell: bash
        run: |
          if [ -f frontend/package-lock.json ]; then
            npm ci --prefix frontend
          else
            npm install --prefix frontend
          fi

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        # apt 的 22.04/24.04 之间 webkit 与 libasound 包名也不一样
        # （4.0 的 API 包在 24.04 已被移除，4.1 在 22.04 还没有），必须逐版本分支。
        run: |
          case "${{ matrix.os }}" in
            ubuntu-22.04)
              # webkit2gtk-4.0 + ImageMagick：这一套只做构建与 AppImage，
              # deb 交给 nfpm（纯 Go，用不到 dpkg-deb / rpm 工具链）。
              sudo apt-get update
              sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev \
                libnss3-dev libasound2 pkg-config imagemagick
              ;;
            ubuntu-24.04)
              # 4.0 的 API 包在 24.04 已被移除，只能装 4.1；libasound2 也改叫 libasound2t64。
              sudo apt-get update
              sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
                libnss3-dev libasound2t64 pkg-config imagemagick
              ;;
          esac

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          wails build -platform windows/amd64 -webview2 embed \
            -ldflags "-X nekolauncher/internal/bindings.builtinCurseForgeAPIKey=$CF_API_KEY"
          # ---- NekoSolo 安装器模板：随启动器一起分发 ----
          # runner 自带 .NET SDK，能构建 net48 的 stub；模板打进 portable zip 的
          # tools/NekoSolo/（启动器导出 exe 的查找位置之一），并单独作为 Release 资产
          # 上传，供旧版启动器的"自动下载模板"兜底。
          dotnet build NekoSolo/NekoSolo.Installer/NekoSolo.Installer.csproj -c Release
          mkdir -p build/tools/NekoSolo dist
          cp NekoSolo/NekoSolo.Installer/bin/Release/net48/NekoSolo.Installer.exe \
            build/tools/NekoSolo/NekoSolo.Installer.exe
          cp build/tools/NekoSolo/NekoSolo.Installer.exe dist/NekoSolo.Installer.exe
          cd build && 7z a -tzip ../NekoLauncher-windows-amd64-portable.zip \
            bin/NekoLauncher.exe tools/NekoSolo/NekoSolo.Installer.exe

      - name: Install nfpm (Linux 发行包)
        if: runner.os == 'Linux'
        shell: bash
        # 用 go install 而不是下载 release 二进制：CI 里多一个下载源就多一个断点。
        # nfpm 只在打包那一步用到（deb/rpm/pkg.tar.zst 都是它产的），且不进 go.mod。
        # arch 容器里 go 是 pacman 装的，GOPATH 落在容器的 /root 下，同样能装。
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build & Package (Linux 发行包 + AppImage)
        # 四个 Linux job 都跑这一步，区别只在 matrix.linux-artifacts（见矩阵注释）：
        #   deb-glibc-2.35 → Ubuntu 22.04 上编的 .deb（webkit2gtk 4.0）
        #   deb-glibc-2.39 → Ubuntu 24.04 上编的 .deb（webkit2gtk 4.1）+ AppImage
        #   rpm            → 同一份 24.04 二进制打的 .rpm
        #   pkg.tar.zst    → 同一份 24.04 二进制打的 pacman 包
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # webkit2gtk 的 API 版本要靠构建标签选：
          #   wails 的 cgo 指令是 `#cgo !webkit2_41 pkg-config: webkit2gtk-4.0`，
          #   即默认找 4.0，只有加上 webkit2_41 才去找 4.1。
          # 24.04 上没有 4.0 的 API 包（只有 4.1），不加这个标签会直接编译失败；
          # 22.04 反过来只有 4.0，所以不能加。这个标签决定二进制链哪个 so，
          # 必须和 linux-artifacts 选的依赖片一致。
          case "${{ matrix.os }}" in
            ubuntu-22.04) WAILS_TAGS="" ;;
            *)            WAILS_TAGS="-tags webkit2_41" ;;
          esac

          wails build -platform linux/amd64 $WAILS_TAGS \
            -ldflags "-X nekolauncher/internal/bindings.builtinCurseForgeAPIKey=$CF_API_KEY"
          chmod +x build/bin/NekoLauncher

          case "${{ matrix.linux-artifacts }}" in
            deb-glibc-2.35) formats="deb";       tag="debian-glibc-2.35" ;;
            deb-glibc-2.39) formats="deb";       tag="debian-glibc-2.39" ;;
            rpm)            formats="rpm";       tag="fedora" ;;
            pkg.tar.zst)    formats="archlinux"; tag="arch" ;;
            *)              formats="deb rpm archlinux"; tag="linux" ;;
          esac

          # 包名里的版本：tag（v0.3.1）去掉 v 前缀；普通分支 push 用 0.0.0-snapshot，
          # 免得同一版本号被反复重发、用户分不清手里那份是哪次构建。
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            export NPFPM_VERSION="${GITHUB_REF_NAME#v}"
          else
            export NPFPM_VERSION="0.0.0-snapshot"
          fi

          # nfpm 的 --target 要求目录已存在，先建好（Windows 那条路径里也建过，互不冲突）
          mkdir -p dist

          for format in $formats; do
            case "$format" in
              deb)
                # 22.04 上编出来的链的是 webkit2gtk 4.0，24.04 及以上才是 4.1
                if [ "${{ matrix.linux-artifacts }}" = "deb-glibc-2.35" ]; then
                  depends="packaging/depends/deb-glibc-2.35.yaml"
                else
                  depends="packaging/depends/deb-glibc-2.39.yaml"
                fi
                ;;
              rpm)       depends="packaging/depends/rpm.yaml" ;;
              archlinux) depends="packaging/depends/archlinux.yaml" ;;
            esac

            # nfpm 只吃一个 config（--config 是普通字符串 flag，传两次是覆盖不是合并），
            # 所以在这里把依赖片并进主配置，拼一份临时配置出来。
            {
              cat packaging/nfpm.yaml
              echo
              cat "$depends"
            } > nfpm-merged.yaml

            nfpm package --config nfpm-merged.yaml --packager "$format" --target dist/
          done

          # 收尾改名：nfpm 的默认名只带"名字-版本-架构"，几个 job 会撞名
          # （deb 两个 job 都是 nekolauncher_<版本>_amd64.deb），而 Release 资产是
          # 拍平在一个目录里的，撞名就是相互覆盖。所以统一改成
          # NekoLauncher-<版本>-linux-amd64-<发行版>.deb / .rpm / .pkg.tar.zst。
          #
          # 注意：通配符会把**上一步刚改好名**的文件也匹配进来（新名字同样以 .deb 结尾），
          # 而循环体内的 mv 又继续往 dist/ 里加新的匹配项，会变成边遍历边追加。
          # 所以先用 find 把待改名的文件列成一个快照再处理，并跳过已经是目标名的文件。
          version="${NPFPM_VERSION}"
          while IFS= read -r file; do
            case "$file" in
              *"NekoLauncher-${version}-linux-amd64-"*) continue ;;
            esac
            case "$file" in
              *.deb)          ext="deb" ;;
              *.rpm)          ext="rpm" ;;
              *.pkg.tar.zst)  ext="pkg.tar.zst" ;;
              *)              continue ;;
            esac
            mv "$file" "dist/NekoLauncher-${version}-linux-amd64-${tag}.${ext}"
          done < <(find dist -maxdepth 1 -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' \) | sort)
          ls -l dist

      - name: Package AppImage
        # AppImage 只做一份：它自带依赖，不含 glibc/webkit 的版本包袱，
        # 每个 job 各做一遍纯属浪费 runner 时间。
        if: matrix.linux-artifacts == 'deb-glibc-2.39'
        shell: bash
        run: |
          # 注意：linuxdeploy 校验图标必须为标准尺寸（历史上 63x63 图标被打回），
          # 这里用 ImageMagick 从 appicon 生成 256x256 标准图标并按 basename 部署。
          convert build/appicon.png -resize 256x256 neko-launcher.png
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/256x256/apps dist
          cp build/bin/NekoLauncher AppDir/usr/bin/
          cp neko-launcher.png AppDir/usr/share/icons/hicolor/256x256/apps/
          cp packaging/neko-launcher.desktop AppDir/
          curl -L -o linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy.AppImage
          # AppImage 运行需要 FUSE；runner 上用 --appimage-extract-and-run 兜底。
          # 注意 extract-and-run 会改变工具的工作目录：appdir/desktop/icon
          # 必须传绝对路径，否则报 "No such file or directory"
          sudo mv linuxdeploy.AppImage /usr/local/bin/
          linuxdeploy.AppImage --appimage-extract-and-run \
            --appdir "$PWD/AppDir" --desktop-file="$PWD/AppDir/neko-launcher.desktop" \
            --icon-file="$PWD/neko-launcher.png" --output appimage
          mv NekoLauncher*.AppImage "dist/NekoLauncher-linux-amd64.AppImage"
          # 同时提供裸二进制 tar.gz（无 FUSE 环境兜底）
          tar -czf "dist/NekoLauncher-linux-amd64.tar.gz" -C build/bin NekoLauncher

      - name: Build (macOS)
        if: runner.os == 'MacOS'
        shell: bash
        run: |
          # 按 matrix.platform 各出各的包：Intel 与 Apple Silicon 不再 lipo 成一个 universal
          # （通用包体积翻倍，且 Intel 机器下 arm64 那半永远用不上）。
          wails build -platform "${{ matrix.platform }}" \
            -ldflags "-X nekolauncher/internal/bindings.builtinCurseForgeAPIKey=$CF_API_KEY"

      - name: Package macOS app (zip)
        # 单开一步：和构建分开，失败时一眼能看出是编译挂了还是打包挂了。
        if: runner.os == 'MacOS'
        shell: bash
        run: |
          # ⚠️ zip 的文件名里不能出现 platform 的斜杠：`darwin/amd64` 会让 zip
          #    往 `NekoLauncher-darwin/amd64.zip` 写，而那个目录不存在，
          #    Info-ZIP 直接以 ZE_OPEN(15) 退出（CI 上就是 "exit code 15"）。
          #    这里把斜杠换成横杠，产物名与 internal/update 里记录的资产名一致。
          archive="NekoLauncher-$(echo "${{ matrix.platform }}" | tr '/' '-').zip"
          # 未签名 app 打成 zip；签名/公证需要 Apple 开发者证书，暂不配置
          # -y 保留符号链接（.app 里的 Framework 版本链接靠它）
          cd build/bin
          zip -r -y "../../$archive" NekoLauncher.app
          cd ../..
          ls -l "$archive"

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          # 各平台把产物集中到 dist/（Linux 的 nfpm/AppImage 已经在 dist/ 里了）。
          #
          # ⚠️ 用 `${{ runner.os }}` 这个**表达式**，别用环境变量 `$RUNNER_OS` 去比字符串：
          #    它的值是 `Windows` / `Linux` / **`macOS`**（小写 m、大写 OS），
          #    写成 `[ "$RUNNER_OS" = "MacOS" ]` 永远为假，macOS 的产物就进不了 dist/，
          #    而 upload-artifact 对空目录只 warn 不报错 —— 表现为"job 全绿但 Release 里
          #    少了两个 macOS 包"，非常难查。之前它侥幸能用是因为 macOS 恰好落在 else 分支。
          case "${{ runner.os }}" in
            Windows)
              cp build/bin/NekoLauncher.exe dist/
              cp NekoLauncher-windows-amd64-portable.zip dist/
              ;;
            macOS)
              # 同样避开 platform 里的斜杠（见上一步的说明）
              archive="NekoLauncher-$(echo "${{ matrix.platform }}" | tr '/' '-').zip"
              cp "$archive" dist/
              ;;
          esac
          # 兜底：dist/ 为空就等于这个 job 什么都没产出，直接失败，
          # 免得再出现"绿着但没东西"的情况。
          if [ -z "$(ls -A dist)" ]; then
            echo "dist/ 是空的，没有任何产物可上传" >&2
            exit 1
          fi
          ls -l dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  release:
    name: Release
    needs: build
    # 触发自版本标签（on.push.tags 过滤：v1.2.3 或 0.2.0 风格）即发布
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 推 tag 即正式发布（非草稿），构建产物直接可见可下载
          draft: false
          generate_release_notes: true
          files: dist/**/*
